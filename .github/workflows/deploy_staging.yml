name: Deploy to Staging

on: workflow_dispatch

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    environment: staging
    env:
      APP_ID: decent-digit-629
      NODE_ENV: production
      DB_PORT: 5432
      MODULE_NAME: staging
      ENV: staging
      VERSION: ${{ github.run_number }}
    permissions:
      id-token: "write"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.x"
          architecture: "x64"

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: "decent-digit-629"
          workload_identity_provider: "projects/354656325390/locations/global/workloadIdentityPools/cfl-pool/providers/cfl-provider"
          service_account: "github-actions-34@decent-digit-629.iam.gserviceaccount.com"

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Google Cloud
        uses: ./.github/actions/deploy_gcloud
        with:
          # Local environment variables.
          app-id: ${{ env.APP_ID }}
          module-name: ${{ env.MODULE_NAME }}
          env: ${{ env.ENV }}
          version: ${{ env.VERSION }}
          # Repository environment variables.
          django-portal-contact-form-email: ${{ vars.DJANGO_PORTAL_CONTACT_FORM_EMAIL }}
          dotmailer-create-contact-url: ${{ vars.DOTMAILER_CREATE_CONTACT_URL }}
          dotmailer-main-address-book-url: ${{ vars.DOTMAILER_MAIN_ADDRESS_BOOK_URL }}
          dotmailer-teacher-address-book-url: ${{ vars.DOTMAILER_TEACHER_ADDRESS_BOOK_URL }}
          dotmailer-student-address-book-url: ${{ vars.DOTMAILER_STUDENT_ADDRESS_BOOK_URL }}
          dotmailer-no-account-address-book-url: ${{ vars.DOTMAILER_NO_ACCOUNT_ADDRESS_BOOK_URL }}
          dotmailer-get-user-by-email-url: ${{ vars.DOTMAILER_GET_USER_BY_EMAIL_URL }}
          dotmailer-delete-user-by-id-url: ${{ vars.DOTMAILER_DELETE_USER_BY_ID_URL }}
          dotmailer-put-consent-data-url: ${{ vars.DOTMAILER_PUT_CONSENT_DATA_URL }}
          dotmailer-send-campaign-url: ${{ vars.DOTMAILER_SEND_CAMPAIGN_URL }}
          dotmailer-thanks-for-staying-campaign-id: ${{ vars.DOTMAILER_THANKS_FOR_STAYING_CAMPAIGN_ID }}
          dotmailer-default-preferences: ${{ vars.DOTMAILER_DEFAULT_PREFERENCES }}
          recaptcha-public-key: ${{ vars.RECAPTCHA_PUBLIC_KEY }}
          gcp-secret-manager-location: ${{ vars.GCP_SECRET_MANAGER_LOCATION }}
          google-cloud-project-id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}

      - name: Notify successful deployment
        if: ${{ success() }}
        run: ./notify_deployment.py
        env:
          DEPLOY_NOTIFY_URL: ${{ secrets.DEPLOY_NOTIFY_URL }}

      - name: Notify failed deployment
        if: ${{ failure() }}
        run: ./notify_deployment.py 0
        env:
          DEPLOY_NOTIFY_URL: ${{ secrets.DEPLOY_NOTIFY_URL }}
